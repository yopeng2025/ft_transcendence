services:
  frontend:
    container_name: dev-frontend
    build:
      target: dev
    volumes:
      - ./frontend:/app:Z                       # Z flag is for SELinux
      - frontend_node_modules:/app/node_modules # named volume for podman to manage volume  && prevent app/node_modules from being overwritten by host
    environment:
      - VITE_OAUTH_42_START_URL=${VITE_OAUTH_42_START_URL}

  backend:
    container_name: dev-backend
    build:
      target: dev
    ports:
      - "5555:3000"
    volumes:
      - ./backend:/app:Z                        # Z flag is for SELinux
      - backend_node_modules:/app/node_modules  # named volume for podman to manage volume
    environment:
      - CORS_ORIGIN=http://localhost:1024,http://${DOMAIN}:1024
    
  proxy:
    container_name: dev-proxy
    build:
      target: dev
    ports:
      - "1024:80"
    
  db:
    container_name: dev-db
    
volumes:
  frontend_node_modules:
  backend_node_modules: