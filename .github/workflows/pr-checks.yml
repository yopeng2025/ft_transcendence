name: PR Auto-Checks

on:
  pull_request:
    types: [opened, edited, synchronize, ready_for_review]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
  
jobs:
  commit-lint:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - run: npm install --no-save @commitlint/cli @commitlint/config-conventional

      # Squash-merge approach: the PR title becomes the commit on main —
      # so we only validate that one string, not every commit.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          PR_TITLE_NORMALIZED="$PR_TITLE"
          if [[ "$PR_TITLE" =~ ^([A-Za-z]+)/(.+)$ ]]; then
            PR_TITLE_NORMALIZED="${BASH_REMATCH[1],,}: ${BASH_REMATCH[2]}"
          fi
          echo "$PR_TITLE_NORMALIZED" | npx commitlint

